# Definición del proyecto para XcodeGen.
# El workflow de GitHub Actions genera Textura.xcodeproj a partir de este archivo.
name: Textura

options:
  bundleIdPrefix: com.textura
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Textura:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Textura
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Textura
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # La carpeta de la app aparece en la app Archivos
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Textura aparece como opción al abrir cualquier archivo desde Archivos / Compartir
        CFBundleDocumentTypes:
          - CFBundleTypeName: Cualquier archivo
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.item
              - public.data
              - public.content
              - public.text
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.textura.editor
        PRODUCT_NAME: Textura
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "NO"
