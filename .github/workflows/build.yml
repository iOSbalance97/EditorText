name: Compilar IPA (sin firmar)
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner de macOS"
        type: choice
        default: xcode-27
        options:
          - xcode-27
          - macos-26
      release_tag:
        description: "Etiqueta de la Release (ejemplo: v1.0.0)"
        type: string
        required: false
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    name: Compilar Textura.ipa
    runs-on: ${{ inputs.runner || vars.RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Versión de Xcode y SDK
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Instalar XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen
      - name: Generar el proyecto de Xcode
        run: xcodegen generate
      - name: Compilar (sin firmar)
        run: |
          set -o pipefail
          xcodebuild \
            -project Textura.xcodeproj \
            -scheme Textura \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
      - name: Crear el IPA
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 3 -name "Textura.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró Textura.app"
            exit 1
          fi
          rm -rf Payload Textura.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          rm -rf Payload/Textura.app/_CodeSignature
          echo "Bundle ID:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Textura.app/Info.plist
          zip -qry Textura.ipa Payload
          if [ ! -s Textura.ipa ]; then
            echo "ERROR: El IPA no existe o está vacío"
            exit 1
          fi
          echo "IPA generado:"
          ls -lh Textura.ipa
          unzip -t Textura.ipa
      - name: Subir el IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Textura-IPA-sin-firmar
          path: Textura.ipa
          if-no-files-found: error
      - name: Subir el registro de compilación si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Publicar IPA en Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -e
          if [ ! -s Textura.ipa ]; then
            echo "ERROR: No se encuentra Textura.ipa"
            exit 1
          fi
          TAG="${RELEASE_TAG:-${EVENT_TAG:-$GITHUB_REF_NAME}}"
          echo "Release de destino: $TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "La Release no existe. Creándola..."
            gh release create "$TAG" \
              --title "Textura $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" Textura.ipa --clobber
          echo "IPA publicado correctamente"
          gh release view "$TAG"
